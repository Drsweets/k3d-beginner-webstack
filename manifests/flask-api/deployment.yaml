apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-api
  namespace: web-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask-api
  template:
    metadata:
      labels:
        app: flask-api
    spec:
      containers:
      - name: flask
        image: python:3.11-slim
        envFrom:
        - configMapRef:
            name: app-config
        ports:
        - containerPort: 5000
        command: ["/bin/sh", "-c"]
        args:
          - pip install flask redis && python - <<EOF
from flask import Flask
import redis
import os
app = Flask(__name__)
redis_client = redis.Redis(host=os.getenv("REDIS_HOST"), port=6379)

@app.route('/')
def index():
    redis_client.incr('visit_counter')
    visits = redis_client.get('visit_counter').decode()
    return f"<h1>K3d 3-Tier Demo</h1><p>Visit Count: {visits}</p>"

if __name__ == '__main__':
    app.run(host="0.0.0.0", port=5000)
EOF
